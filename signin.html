<!DOCTYPE html>
<html>
    <head>
        <title>Sign In</title>
        <link rel="icon" href="pic/console.png">
        <link rel="stylesheet" href="stylingsignin.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    </head>

    <body>
        <div class="container" id="container">
            <div class="form-container sign-up">
                <form>
                    <h1 class="pink">Create Account</h1>
                    <div class="social-icons">
                        <a href="#" class="icon">
                            <i class="fa-brands fa-google-plus-g"></i>
                        </a>
                        <a href="#" class="icon">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>
                        <a href="#" class="icon">
                            <i class="fa-brands fa-square-instagram"></i>
                        </a>
                        <a href="#" class="icon">
                            <i class="fa-brands fa-tiktok"></i>
                        </a>
                    </div>
                    <span class="pink">or use your email for registration</span>
                    <input type="text" placeholder="Name" />
                    <input type="email" placeholder="Email" />
                    <input type="password" placeholder="Password" />
                    <button>Sign Up</button>
                </form>
            </div>
            <div class="form-container sign-in">
                <form>
                    <h1 class="pink">Sign In</h1>
                    <div class="social-icons">
                        <a href="#" class="icon">
                            <i class="fa-brands fa-google-plus-g"></i>
                        </a>
                        <a href="#" class="icon">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>
                        <a href="#" class="icon">
                            <i class="fa-brands fa-microsoft"></i>
                        </a>
                        <a href="#" class="icon">
                            <i class="fa-brands fa-linkedin"></i>
                        </a>
                    </div>
                    <span class="pink">or use your email and password</span>
                    <input type="email" placeholder="Email" />
                    <input type="password" placeholder="Password" />
                    <a href="#" class="pink">Forgot Your Password?</a>
                    <button>Sign In</button>
                </form>
            </div>
            <div class="toggle-container">
                <div class="toggle">
                    <div class="toggle-panel toggle-left">
                            <h1>Welcome Back!</h1>
                            <p>Sign in with your username and password</p>
                            <button class="hidden" id="login">Sign In</button>
                    </div>
                    <div class="toggle-panel toggle-right">
                        <h1>Hello, Yumster!</h1>
                        <p>Register to get discounts on your yummy adventures</p>
                        <button class="hidden" id="register">Register</button>
                    </div>
                </div>
            </div>
        </div>
        
        <script src="script.js"></script>
    </body>

</html>
