<!DOCTYPE html>
<html>
    <head>
        <title>sign in</title>
        <link rel="icon" href="pic/console.png">
        <link rel="stylesheet" href="stylingsignin.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    </head>

    <body>
        <div class="container" id="container">
            <div class="form-container sign-in">
                <form>
                    <h1 class="pink">Sign In</h1>
                    <div class="social-icons">
                        <a href="#" class="icon">
                            <i class="fa-brands fa-google-plus-g"></i>
                        </a>
                        <a href="#" class="icon">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>
                        <a href="#" class="icon">
                            <i class="fa-brands fa-microsoft"></i>
                        </a>
                        <a href="#" class="icon">
                            <i class="fa-brands fa-linkedin"></i>
                        </a>
                    </div>
                    <span class="pink">or use your email and password</span>
                        <input type="email" name="email" placeholder="Email" required/>
                            <i class="fa-solid fa-envelope" id="input1-sign-in"></i>
                        <input type="password" name="password" placeholder="Password" required/>
                            <i class="fa-solid fa-lock" id="input2-sign-in"></i>
            
                    <a href="#" class="pink">Forgot Your Password?</a>
                    <button type="submit" name="login">Sign In</button>
                </form>
            </div>
            <div class="toggle-container">
                <div class="toggle">
                    <div class="toggle-panel toggle-right">
                        <h1 id="toggle-title">Hello, Yumster.</h1>
                        <p>Register to get discounts on your yummy adventures</p>
                        <a href="createaccount.html" class="hidden" id="register">Register</a>
                    </div>
                </div>
            </div>
        </div>
        
    </body>

</html>
