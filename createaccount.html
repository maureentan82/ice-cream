<!DOCTYPE html>
<html>
    <head>
        <title>create an account!</title>
        <link rel="icon" href="pic/console.png">
        <link rel="stylesheet" href="stylingcreateaccount.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    </head>

    <body>
        <div class="container" id="container">
            <div class="form-container sign-up">
                <form>
                    <h1 class="pink">Create Account</h1>
                    <div class="social-icons">
                        <a href="#" class="icon">
                            <i class="fa-brands fa-google-plus-g"></i>
                        </a>
                        <a href="#" class="icon">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>
                        <a href="#" class="icon">
                            <i class="fa-brands fa-microsoft"></i>
                        </a>
                        <a href="#" class="icon">
                            <i class="fa-brands fa-linkedin"></i>
                        </a>
                    </div>
                    <span class="pink">or use your email for registration</span>
                    <input type="text" name="name" placeholder="Name" required />
                        <i class="fa-solid fa-user" id="input1-sign-up"></i>
                    <input type="email" name="email" placeholder="Email" required/>
                        <i class="fa-solid fa-envelope" id="input2-sign-up"></i>
                    <input type="password" name="password" placeholder="Password" required />
                        <i class="fa-solid fa-lock" id="input3-sign-up"></i>
                    <button type="submit" name="register">Sign Up</button>
                </form>
            </div>
            <div class="toggle-container">
                <div class="toggle">
                    <div class="toggle-panel toggle-left">
                            <h1 id="toggle-title">Welcome Back.</h1>
                            <p>Sign in with your username and password</p>
                            <a href="signin.html" class="hidden" id="login">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    
    </body>

</html>
